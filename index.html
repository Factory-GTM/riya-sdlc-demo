<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layover Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body data-brand-guide-theme="light">
    <main class="page">
      <header class="header">
        <h1>Layover Explorer</h1>
        <p>Can you leave the airport, and what's the weather?</p>
      </header>

      <form id="layover-form" class="card form">
        <label>
          Layover airport
          <select id="airport" name="airport"></select>
        </label>
        <label>
          Arrival date and time
          <input id="arrival" name="arrival" type="datetime-local" required />
          <small id="timezone-hint"></small>
        </label>
        <fieldset>
          <legend>Layover length</legend>
          <label class="inline">
            <input name="hours" type="number" min="0" max="23" value="5" required /> hours
          </label>
          <label class="inline">
            <input name="minutes" type="number" min="0" max="59" step="5" value="0" required /> minutes
          </label>
        </fieldset>
        <label class="inline">
          <input name="international" type="checkbox" /> International arrival (adds customs time)
        </label>
        <button type="submit">Check my layover</button>
      </form>

      <div id="result"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
